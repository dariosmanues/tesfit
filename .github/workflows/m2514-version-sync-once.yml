name: M2514 version sync

on:
  push:
    branches: [fix/m2514-version-sync]

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply M2.5.14 version patch
        run: python tools/m2514_version_sync_patch.py

      - name: Add version sync regression test
        run: |
          cat > services/geometry-api/test_m2514_version_sync.py <<'PY'
          from pathlib import Path

          ROOT = Path(__file__).resolve().parent
          app_js = (ROOT / 'web/app.js').read_text(encoding='utf-8')
          index = (ROOT / 'web/index.html').read_text(encoding='utf-8')
          monitor = (ROOT / 'web/recovery-monitor.js').read_text(encoding='utf-8')
          recovery = (ROOT / 'app/recovery_solver.py').read_text(encoding='utf-8')
          main = (ROOT / 'app/main.py').read_text(encoding='utf-8')

          assert 'const DEVOS_FRONTEND_VERSION = "2.5.14";' in app_js
          assert 'Milestone 2.5.14' in index
          assert 'M2.5.14 — Recovery Solver Monitor' in index
          assert '/static/app.css?v=2.5.14' in index
          assert '/static/recovery-monitor.css?v=2.5.14' in index
          assert '/static/app.js?v=2.5.14' in index
          assert '/static/recovery-monitor.js?v=2.5.14' in index
          assert '"version": "2.5.14"' in main
          assert 'M2.5.13' not in monitor
          assert 'M2.5.13' not in recovery
          print('M2.5.14 VERSION SYNC TEST PASSED')
          PY

      - name: Install dependencies
        working-directory: services/geometry-api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Initialize test database
        working-directory: services/geometry-api
        run: python -c "from app import main; main.init_db()"

      - name: Syntax and full regression
        working-directory: services/geometry-api
        run: |
          python -m py_compile app/main.py app/recovery_solver.py
          node --check web/app.js
          node --check web/recovery-monitor.js
          python test_m2514_version_sync.py
          python test_m2513_structural_corridor.py
          python test_m2513_recovery_solver.py
          python test_m2512_lot_efficiency.py
          python test_m2511_masterplan_topology.py
          python test_m2511_topology_shapes.py
          python test_m2510_block_first.py
          python test_m258_saleable_residual.py

      - name: Commit verified M2.5.14 version sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m2514-version-sync-once.yml tools/m2514_version_sync_patch.py
          git add services/geometry-api/app/main.py services/geometry-api/app/recovery_solver.py services/geometry-api/web/app.js services/geometry-api/web/index.html services/geometry-api/web/recovery-monitor.js services/geometry-api/test_m2513_recovery_solver.py services/geometry-api/test_m2514_version_sync.py MILESTONE2_5_14_STATUS.md
          git commit -m "fix: synchronize Development OS version to M2.5.14"
          git push origin HEAD:fix/m2514-version-sync
