name: Site title update once

on:
  push:
    branches: [fix/site-title-fikri-ikhsan]

permissions:
  contents: write

jobs:
  update-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace title text
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('services/geometry-api/web/index.html')
          text = p.read_text(encoding='utf-8')
          old_title = '<title>Development OS — Milestone 2.5.14</title>'
          old_h1 = '<h1>Generative Site Planning — Milestone 2.5.14</h1>'
          assert old_title in text
          assert old_h1 in text
          text = text.replace(old_title, '<title>"FIKRI IKHSAN" Site Planing</title>', 1)
          text = text.replace(old_h1, '<h1>"FIKRI IKHSAN" Site Planing</h1>', 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Verify replacement
        run: |
          grep -F '<title>"FIKRI IKHSAN" Site Planing</title>' services/geometry-api/web/index.html
          grep -F '<h1>"FIKRI IKHSAN" Site Planing</h1>' services/geometry-api/web/index.html
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/site-title-update-once.yml
          git add services/geometry-api/web/index.html
          git commit -m 'chore: rename site planner title to FIKRI IKHSAN'
          git push origin HEAD:fix/site-title-fikri-ikhsan
