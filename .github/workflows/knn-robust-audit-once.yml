name: Robust KNN verify

on:
  push:
    branches:
      - fix/robust-knn-audit

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python tools/patch_knn_robust.py

      - name: Verify JavaScript and regression tests
        run: |
          node --check services/geometry-api/web/market-knn.js
          node --check services/geometry-api/web/recovery-monitor.js
          node services/geometry-api/web/market-knn.test.js
          grep -q 'Min–Max neighbor KNN' services/geometry-api/web/market-knn.js
          grep -q 'IQR neighbor KNN' services/geometry-api/web/market-knn.js
          grep -q 'Audit neighbor KNN' services/geometry-api/web/market-knn.js
          grep -q 'knn2' services/geometry-api/web/recovery-monitor.js

      - name: Commit verified correction
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git rm .github/workflows/knn-robust-audit-once.yml tools/patch_knn_robust.py
          git add services/geometry-api/web/market-knn.js services/geometry-api/web/market-knn.test.js services/geometry-api/web/recovery-monitor.js
          git commit -m 'fix: make Spatial KNN robust and auditable'
          git push origin HEAD:fix/robust-knn-audit
