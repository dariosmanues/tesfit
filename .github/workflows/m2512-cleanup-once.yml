name: M2512 cleanup

on:
  push:
    branches: [fix/m2512-cleanup-no-residual-cap]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply cleanup patch
        run: python tools/m2512_cleanup.py

      - name: Install dependencies
        working-directory: services/geometry-api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run syntax and regression gates
        working-directory: services/geometry-api
        run: |
          python -m py_compile app/main.py
          node --check web/app.js
          python -c "import app.main as m; m.init_db()"
          python test_m2512_lot_efficiency.py
          python test_m2511_masterplan_topology.py
          python test_m2511_topology_shapes.py
          python test_m2510_block_first.py
          python test_m258_saleable_residual.py

      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m2512-cleanup-once.yml tools/m2512_cleanup.py
          git add services/geometry-api/app/main.py services/geometry-api/web/app.js services/geometry-api/web/index.html services/geometry-api/test_m2512_lot_efficiency.py MILESTONE2_5_12_STATUS.md README.md
          git commit -m "fix: remove active residual 3% target from M2.5.12"
          git push origin HEAD:fix/m2512-cleanup-no-residual-cap
