name: M2513 structural corridor recovery

on:
  push:
    branches: [feat/m2513-structural-corridor-recovery]

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply structural corridor patch
        run: |
          python tools/m2513_structural_corridor_patch.py
          python - <<'PY'
          from pathlib import Path
          p=Path('services/geometry-api/app/recovery_solver.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('def _mutation_specs(core: dict[str, Any], req: Any, round_no: int, batch_size: int = 16)', 'def _mutation_specs(core: dict[str, Any], req: Any, round_no: int, batch_size: int = 12)', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Install dependencies
        working-directory: services/geometry-api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Initialize test database
        working-directory: services/geometry-api
        run: python -c "from app import main; main.init_db()"

      - name: Syntax and full regression
        working-directory: services/geometry-api
        run: |
          python -m py_compile app/main.py app/recovery_solver.py
          node --check web/app.js
          node --check web/recovery-monitor.js
          python test_m2513_structural_corridor.py
          python test_m2513_recovery_solver.py
          python test_m2512_lot_efficiency.py
          python test_m2511_masterplan_topology.py
          python test_m2511_topology_shapes.py
          python test_m2510_block_first.py
          python test_m258_saleable_residual.py

      - name: Commit verified structural corridor recovery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m2513-structural-corridor-once.yml tools/m2513_structural_corridor_patch.py
          git add services/geometry-api/app/recovery_solver.py services/geometry-api/web/recovery-monitor.js services/geometry-api/test_m2513_structural_corridor.py MILESTONE2_5_13_STATUS.md
          git commit -m "feat: add structural corridor recovery search"
          git push origin HEAD:feat/m2513-structural-corridor-recovery
