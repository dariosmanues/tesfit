name: Pekanbaru market reference verify

on:
  push:
    branches: [feat/pekanbaru-market-reference]

permissions:
  contents: write

jobs:
  verify-and-activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reconstruct repaired chunks
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('services/geometry-api/web/data')
          repairs = {
              'pekanbaru_housing_market.part01.b64': ['.repair_part01a.txt','.repair_part01b.txt'],
              'pekanbaru_housing_market.part03.b64': ['.repair_part03a.txt','.repair_part03b.txt'],
              'pekanbaru_housing_market.part06.b64': ['.repair_part06a.txt','.repair_part06b.txt'],
          }
          for target, sources in repairs.items():
              text = ''.join((root / name).read_text(encoding='utf-8').strip() for name in sources)
              assert len(text) == 8000, (target, len(text))
              (root / target).write_text(text, encoding='utf-8')
          PY

      - name: Validate complete joined dataset
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json
          root = Path('services/geometry-api/web/data')
          parts = [root / f'pekanbaru_housing_market.part{i:02d}.b64' for i in range(1, 8)]
          expected_sha1 = [
              '7fb882604fb7bbf93236a04da879a51716bd47a8',
              'a9b0ef8e786a37674ddfd66ed5b41352bd435a4c',
              'c01f177303a4abd710c0647c2eac574e0b520449',
              '4532f86f4b750aabc71d7b143ab0c2194612be0d',
              '0087c4cd12b51cc66cbeee7c421957a1d32893d8',
              'fb736a2498d05c78f6ab553ff0a7543fd6b48670',
              '9a7362f41e93084ca4cfae572840fbb25509d101',
          ]
          assert all(p.exists() for p in parts), parts
          texts = [p.read_text(encoding='utf-8').strip() for p in parts]
          chunk_lengths = [len(t) for t in texts]
          actual_sha1 = [hashlib.sha1(t.encode()).hexdigest() for t in texts]
          for i, (n, actual, expected) in enumerate(zip(chunk_lengths, actual_sha1, expected_sha1), 1):
              print(f'CHUNK {i}: len={n} sha1={actual} expected={expected} {"OK" if actual == expected else "MISMATCH"}')
          assert chunk_lengths == [8000,8000,8000,8000,8000,8000,4696], chunk_lengths
          assert actual_sha1 == expected_sha1, actual_sha1
          b64 = ''.join(texts)
          compressed = base64.b64decode(b64, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == '8458a080a9606953dc67e113e0ab8f03e034ec183626f3c2152f8c27b5202d0c'
          raw = gzip.decompress(compressed)
          assert hashlib.sha256(raw).hexdigest() == '4e093599eeda74f6352dda0f27bde0c365f94349cd7a7e2ba9e3b3355e43e6ac'
          payload = json.loads(raw)
          records = payload['records']
          meta = payload['metadata']
          assert len(records) == 519, len(records)
          assert meta == {'record_count':519,'mapped_count':518,'unmapped_count':1}, meta
          required = {'id','name','developer','association','district','village','subsidized_units','commercial_units','phone','whatsapp','email','lat','lon','types'}
          assert all(required.issubset(r) for r in records)
          assert len({r['id'] for r in records}) == 519
          assert sum(1 for r in records if r.get('lat') is not None and r.get('lon') is not None) == 518
          assert sum(1 for r in records if r.get('lat') is None or r.get('lon') is None) == 1
          print('DATASET OK:', len(records), 'projects /', meta['mapped_count'], 'mapped')
          PY

      - name: Activate market reference loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('services/geometry-api/web/recovery-monitor.js')
          text = p.read_text(encoding='utf-8')
          marker = '// Development OS — Pekanbaru housing market reference loader.'
          if marker not in text:
              text += '''\n\n// Development OS — Pekanbaru housing market reference loader.\n(() => {\n  const load = () => {\n    if (document.querySelector('script[data-devos-market-reference]')) return;\n    const s = document.createElement('script');\n    s.src = '/static/market-reference.js?v=2.5.14';\n    s.dataset.devosMarketReference = '1';\n    document.body.appendChild(s);\n  };\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', load, {once:true});\n  else load();\n})();\n'''
              p.write_text(text, encoding='utf-8')
          PY

      - name: JavaScript syntax checks
        run: |
          node --check services/geometry-api/web/market-reference.js
          node --check services/geometry-api/web/recovery-monitor.js

      - name: Commit verified activation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pekanbaru-market-reference-verify-once.yml
          git rm services/geometry-api/web/data/.repair_part01a.txt services/geometry-api/web/data/.repair_part01b.txt services/geometry-api/web/data/.repair_part03a.txt services/geometry-api/web/data/.repair_part03b.txt services/geometry-api/web/data/.repair_part06a.txt services/geometry-api/web/data/.repair_part06b.txt
          git add services/geometry-api/web/recovery-monitor.js services/geometry-api/web/data/pekanbaru_housing_market.part01.b64 services/geometry-api/web/data/pekanbaru_housing_market.part03.b64 services/geometry-api/web/data/pekanbaru_housing_market.part06.b64
          git commit -m "feat: activate Pekanbaru market reference in Development OS"
          git push origin HEAD:feat/pekanbaru-market-reference
