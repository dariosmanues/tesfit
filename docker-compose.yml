services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: devos
      POSTGRES_USER: devos
      POSTGRES_PASSWORD: devos
    ports:
      - "5432:5432"
    volumes:
      - devos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devos -d devos"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./services/geometry-api
    environment:
      DATABASE_URL: postgresql://devos:devos@db:5432/devos
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  devos_pg:
